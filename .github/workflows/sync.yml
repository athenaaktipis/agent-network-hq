name: Sync HQ page

# Refreshes the live page from Google Drive without anyone's laptop being open.
# Updates only the deterministic regions (word counts, activity edges, verified
# feed, timestamps). Editorial content — Question of the day, mission-pulse
# prose, the gauntlet — is written by Claude during a local `/sync` and is never
# touched here, so the two can't fight.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hq-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Stop after the grant deadline
        id: gate
        run: |
          # Sprint ends Aug 9 2026 (UTC). After that this workflow idles.
          if [ "$(date -u +%s)" -gt "$(date -u -d '2026-08-09 23:59:59' +%s)" ]; then
            echo "Sprint is over — skipping."
            echo "expired=true" >> "$GITHUB_OUTPUT"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.expired == 'false'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.expired == 'false'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.gate.outputs.expired == 'false'
        run: pip install --quiet google-api-python-client google-auth-oauthlib

      - name: Refresh page data from Google Drive
        if: steps.gate.outputs.expired == 'false'
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
        run: python tools/cloud_sync.py

      - name: Publish if anything changed
        if: steps.gate.outputs.expired == 'false'
        run: |
          if [ -z "$(git status --porcelain index.html)" ]; then
            echo "No changes — nothing to publish."
            exit 0
          fi
          git config user.name  "hq-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-sync: refresh page data from the working doc"
          # Another sync may have landed while this one ran; rebase and retry once.
          git pull --rebase origin main || true
          git push origin HEAD:main
